spec_version: "0.1.0"
name: multi-cloud-egress-optimizer
version: 1.0.0
description: Audits cross-region and cross-cloud data transfer topology to enforce zero-egress routing policies and reduce cloud network costs.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - egress-routing
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/Rucha0901/multi-cloud-egress-optimizer"
